<p>vehicles works!</p>
<input type="text" placeholder="search"[(ngModel)]="term">

<button class="red-button" (click)="filtervehicle()">search</button>
<button class="green-button" (click)="getvehiclesWithParams()">search2</button>
<button class="green-button"  (click)="getvehiclesWithParams()">sort2</button>
<label for="">Column:</label>
<select [(ngModel)]="column">
    <option value="color">color</option>
     <option value="fuel">fuel</option>
      <option value="model">model</option>

</select>
<label for="">order:</label>
<select [(ngModel)]="order">
<option value="asc">Ascending</option>
 <option value="desc">Descending</option>
 </select>
 <button class="red-button" (click)="sortVehicle()">sort</button>
 


<table>
    <thead>

        <tr>
            <th>Vechicle</th>
            <th>manufacturer</th>
            <th>model</th>
            <th>type</th>
            <th>fuel</th>
            <th>color</th>
            <th>image</th>
            <!-- <th>cost</th>
            <th>tyres</th> -->
            <th>id</th>
            <th>actions</th>
        </tr>
    </thead>
    <tbody>



    <tr *ngFor="let vehicle of vehicles">
        <td>{{vehicle.Vehicle}}</td>
        <td>{{vehicle.manufacturer}}</td>
        <td>{{vehicle.model}}</td>
        <td>{{vehicle.type}}</td>
        <td>{{vehicle.fuel}}</td>
        <td>{{vehicle.color}}</td>
        <td>
        <img [src]="vehicle.image" alt="" width="100px" height="100px">
        </td>
        <!-- <td>{{vehicle.cost}}</td>
                <td>{{vehicle.tyres}}</td> -->
                 <td>{{vehicle.id}}</td>
                 <td>
                 <button class="red-button" (click)="deleteVehicle(vehicle.id)">delete</button>

                 </td>
    </tr>
    </tbody>


</table>
<button class="yellow-button" (click)="pagevehicles(i+1)"
*ngFor="let page of [].constructor(10); let i =index">
{{i+1}}
</button>
<hr>
<button calss="green-button" (click)="getvehiclesWithParams(i+1)"

*ngFor="let page of [].constructor(10); let i=index">
{{i+1}}
</button>
